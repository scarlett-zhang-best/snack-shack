<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Snack Shack</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>🍬 The Snack Shack 🍬</h1>
  <p class="tagline">Student snacks, straight to your table — check the prices!</p>
</header>

<section class="sign" aria-label="Time and location">
  <div class="cake">
    <div class="tier top">
      <span class="cake-title">The Snack Shack</span>
    </div>
    <div class="tier middle">
      <span>📍 Where: Lunch Room</span>
    </div>
    <div class="tier bottom">
      <span>⏰ When: During Lunch, 11:45 – 12:30 PM</span>
    </div>
    <div class="plate"></div>
  </div>
</section>

<nav class="filters" aria-label="Snack filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="chips">Chips</button>
  <button class="filter-btn" data-filter="sweets">Sweets</button>
  <button class="filter-btn" data-filter="drinks">Drinks</button>
</nav>

<main class="grid" id="snack-grid"></main>

<footer>
  <p>The Snack Shack — Lunch Room · 11:45 – 12:30 PM · Prices in USD</p>
</footer>

<script src="script.js"></script>
</body>
</html>
